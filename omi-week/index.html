<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神歐迷的一週</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A6CC2; --green:#35A53A; --sakuyo:#1F5FB0; --ink:#1D2B3A; --ink-soft:#5A6878; --gold:#F2A93B;
  --bg:#E4F1FA; --surface:#FFFFFF; --line:#CFE0EC; --chip:#EEF6EC;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --ink:#E8F0F7; --ink-soft:#A7B6C4; --bg:#0E1A25; --surface:#172634; --line:#2A3D4F; --chip:#1F3327; --sakuyo:#7FB2F0; }
}
:root[data-theme="dark"]{ --ink:#E8F0F7; --ink-soft:#A7B6C4; --bg:#0E1A25; --surface:#172634; --line:#2A3D4F; --chip:#1F3327; --sakuyo:#7FB2F0; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:#101c3a;color:var(--ink);font-family:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;z-index:2}
.bar{height:10px;border:2px solid #1D2B3A;border-radius:6px;background:#E3E8ED;overflow:hidden}
.bar i{display:block;height:100%;width:0}
#xp i{background:#7CC6F2}
.row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.93);color:#1D2B3A;border:2px solid #1D2B3A;border-radius:10px;padding:2px 8px;font-weight:800;font-size:.84rem;white-space:nowrap}
#hpWrap{flex:1;min-width:120px;max-width:220px;display:flex;align-items:center;gap:6px}
#hpWrap .bar{flex:1;height:12px}
#hp i{background:#35A53A}
#pauseBtn{pointer-events:auto;font:inherit;font-weight:800;background:#fff;color:#1D2B3A;border:2px solid #1D2B3A;border-radius:10px;padding:3px 10px;cursor:pointer;margin-left:auto}
#bossBar{margin-top:6px;background:rgba(29,43,58,.85);border-radius:10px;padding:4px 8px;color:#fff;font-weight:800;font-size:.85rem}
#bossBar .bar{margin-top:3px;background:#3a4a5c;border-color:#fff}
#bossFill{background:#ff6b5a}
#slots{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.srow{display:flex;gap:3px}
.slot{width:32px;height:38px;background:rgba(255,255,255,.9);border:2px solid #1D2B3A;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1D2B3A}
.slot.p{background:rgba(238,246,236,.95)}
.slot.empty{opacity:.35}
.slot span{font-size:.55rem;font-weight:800;line-height:1.1}
.slot.evo{border-color:var(--gold);background:#FFF6D6}
#debuffs{display:flex;gap:4px}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-10px);opacity:0;transition:opacity .3s,transform .3s;background:rgba(255,255,255,.95);color:#1D2B3A;border:3px solid #1D2B3A;border-radius:14px;padding:8px 16px;text-align:center;pointer-events:none;z-index:3;min-width:220px}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner b{display:block;font-size:1.1rem;color:#0A6CC2}
#banner span{font-weight:600;font-size:.92rem}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 12px max(14px,env(safe-area-inset-bottom,0px));background:rgba(16,28,58,.6);z-index:5}
.overlay.show{display:flex}
.panel{background:var(--surface);color:var(--ink);border:3px solid #1D2B3A;border-radius:22px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:18px 16px;text-align:center}
.panel h2{font-size:1.3rem;font-weight:800;margin:0 0 12px}
.panel h3{font-size:1.05rem;font-weight:800;margin:14px 0 8px;text-align:left}
.panel p{color:var(--ink-soft);line-height:1.6;margin:6px 0}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;font:inherit;font-weight:800;font-size:1.05rem;padding:12px 10px;border-radius:14px;border:3px solid #1D2B3A;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}
.btn:focus-visible,.card:focus-visible,.sel:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.small{font-size:.82rem}
/* 選關 */
#select{background:radial-gradient(circle at 50% 40%,#1f3a78 0%,#101c3a 70%);flex-direction:column}
#select h1{color:#fff;font-size:1.6rem;margin:0 0 4px;text-shadow:0 3px 0 #0A6CC2;letter-spacing:.06em}
#selLetters{display:flex;gap:6px;justify-content:center;margin:-4px 0 12px}
#selLetters span{width:26px;height:28px;display:grid;place-items:center;font-weight:800;border-radius:7px;border:2px solid #3E5468;color:#3E5468;background:rgba(255,255,255,.06)}
#selLetters span.got{background:#1F5FB0;border-color:#F8B41B;color:#fff}
#selProg{color:#bfe6ff;font-weight:600;margin:0 0 12px;font-size:.9rem}
#selGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(96vw,520px)}
.sel{position:relative;aspect-ratio:1/1.05;background:#0d1733;border:3px solid #4a6fb5;border-radius:12px;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px;box-shadow:inset 0 0 0 3px #0d1733,inset 0 0 0 5px #27447f}
.sel canvas{max-width:86%;max-height:60%}
.sel b{font-size:1rem}
.sel span{font-size:.72rem;color:#bfe6ff;line-height:1.2}
.sel.on{border-color:#ffd95a;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{border-color:#fff}}
.sel.center{background:#e4f1fa;border-color:#ffd95a;cursor:default}
.sel.center b{color:#1D2B3A}
.sel.locked b{color:#8fa3c0}
.sel .done{position:absolute;right:6px;top:4px;font-style:normal;background:#35A53A;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
.selHint{color:#8fa3c0;font-size:.8rem;margin-top:10px}
/* 關卡介紹 */
#intro .panel{background:repeating-linear-gradient(135deg,#0d1733 0 14px,#13214a 14px 28px);color:#fff;border-color:#ffd95a}
#intro p{color:#bfe6ff}
#inDay{font-size:.95rem;color:#ffd95a;font-weight:800}
#inBoss{font-size:1.7rem;margin:4px 0;letter-spacing:.08em;text-shadow:0 3px 0 #0A6CC2}
#inBossImg{display:flex;justify-content:center;margin:8px 0}
#intro h3{color:#ffd95a}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipx{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 8px;font-size:.75rem;font-weight:600;min-width:62px}
#inWeak{color:#ffd95a!important;font-weight:800}
.chipx.pick{font:inherit;font-size:.75rem;font-weight:600;color:inherit;border:2px solid transparent;cursor:pointer}
.chipx.pick.on{border-color:#ffd95a;background:rgba(255,217,90,.18)}
.chipx em{font-style:normal;font-size:.65rem;font-weight:800;color:#1D2B3A;background:#ffd95a;border-radius:5px;padding:0 4px}
/* 升級卡 */
#cards{display:flex;flex-direction:column;gap:10px}
.card{position:relative;display:flex;gap:12px;align-items:center;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:3px solid #1D2B3A;border-radius:16px;padding:10px 12px;cursor:pointer}
.card:hover{background:var(--chip)}
.card canvas{flex:none;background:#FFF6D6;border-radius:10px;padding:3px;box-sizing:content-box}
.card.pas canvas{background:#EEF6EC}
.card.sak{border-color:var(--sakuyo)}
.card.sak canvas{background:#FFF1E2}
.card .sakb{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:.8rem;font-weight:800;color:var(--sakuyo);vertical-align:1px}
.card .sakb canvas{background:none;padding:0;border-radius:0}
.card.evo{border-color:var(--gold);background:#FFF6D6;color:#1D2B3A}
.card b{font-size:1.08rem}
.card .tag{margin-left:8px;font-size:.76rem;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:1px 6px}
.card.pas .tag{background:var(--green)}
.card.evo .tag{background:var(--gold)}
.card p{margin:4px 0 0;font-size:.88rem;line-height:1.5;color:inherit;opacity:.9}
.card small{display:block;margin-top:3px;font-size:.74rem;opacity:.65;line-height:1.4}
.kbd{position:absolute;right:10px;top:8px;font-size:.72rem;font-weight:800;opacity:.45}
/* 圖鑑 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;text-align:left}
.cell{border:2px solid var(--line);border-radius:12px;padding:8px}
.cell canvas{margin:0 auto 6px;max-width:100%}
.cell b{display:block;font-size:.95rem}
.cell span{display:block;font-size:.74rem;line-height:1.45;color:var(--ink-soft)}
.cell.locked canvas{filter:brightness(0) opacity(.3)}
#cardImg{width:100%;max-height:54vh;object-fit:contain;border-radius:10px;display:block}
</style>
</head>
<body>
<canvas id="game" aria-label="神歐迷的一週遊戲畫面"></canvas>
<div id="hud" hidden>
  <div class="bar" id="xp"><i id="xpFill"></i></div>
  <div class="row">
    <div id="hpWrap"><span class="pill">元氣</span><div class="bar" id="hp"><i id="hpFill"></i></div></div>
    <span class="pill" id="stageLbl"></span><span class="pill" id="remain"></span><span class="pill" id="lvl">Lv 1</span>
    <button id="pauseBtn" aria-label="暫停">Ⅱ</button>
  </div>
  <div class="row"><span class="pill small" id="kills">淨化 0</span><div id="debuffs"></div></div>
  <div id="bossBar" hidden><span id="bossName"></span><div class="bar"><i id="bossFill"></i></div></div>
  <div id="slots"></div>
</div>
<div id="banner"><b id="bnA"></b><span id="bnB"></span></div>

<div class="overlay" id="select">
  <h1>神歐迷的一週</h1>
  <p id="selProg"></p>
  <div id="selLetters" aria-label="SAKUYO 字母收集"></div>
  <div id="selGrid"></div>
  <p class="selHint">選一天開始淨化煩惱　方向鍵移動，Enter 決定</p>
</div>

<div class="overlay" id="intro"><div class="panel">
  <div id="inDay"></div>
  <div id="inBoss"></div>
  <div id="inBossImg"></div>
  <p id="inText"></p>
  <p id="inWeak"></p>
  <h3>本日煩惱</h3><div class="chips" id="inEnemies"></div>
  <h3>推薦商品</h3><div class="chips" id="inItems"></div>
  <h3 id="inStartH">出發商品</h3><div class="chips" id="inStart"></div>
  <p class="small" id="inStartHint"></p>
  <p class="small">手機：按住畫面拖曳移動　電腦：方向鍵或 WASD</p>
  <div class="btns"><button class="btn" id="backBtn">返回</button><button class="btn primary" id="goBtn">出發</button></div>
</div></div>

<div class="overlay" id="level"><div class="panel"><h2 id="lvTitle">升級！</h2><div id="cards"></div></div></div>
<div class="overlay" id="pauseOv"><div class="panel"><h2>暫停中</h2><div class="btns"><button class="btn primary" id="resumeBtn">繼續</button><button class="btn" id="quitBtn">放棄這關</button></div></div></div>

<div class="overlay" id="dex"><div class="panel">
  <h2>圖鑑</h2>
  <p class="small">玩過的商品和遇過的煩惱會解鎖說明。</p>
  <h3>商品</h3><div class="grid" id="dexItems"></div>
  <h3>煩惱</h3><div class="grid" id="dexEnemies"></div>
  <div class="btns"><button class="btn primary" id="dexClose">返回選關</button></div>
</div></div>

<div class="overlay" id="result"><div class="panel">
  <h2 id="resTitle"></h2>
  <img id="cardImg" alt="這一關的淨化明細卡">
  <p class="small" id="saveHint" hidden>長按或按右鍵點圖片即可儲存明細卡。</p>
  <div class="btns"><button class="btn green" id="dlBtn">下載明細卡</button><button class="btn primary" id="againBtn">再挑戰</button></div>
  <div class="btns"><button class="btn" id="selBtn">回選關畫面</button></div>
</div></div>
<script>
(function(){
"use strict";
// ===== 01-mascot.js =====
// ===== 神歐迷像素角色：依設定圖量測的形狀逐格取樣 =====
const C={ink:'#1d2b3a',w:'#ffffff',s1:'#e6eaee',s2:'#cfd6de',b:'#0a86cf',bd:'#066ba6',g:'#94b72a',pk:'#f07b8a'};
function cap(px,py,ax,ay,bx,by,r0,r1){const vx=bx-ax,vy=by-ay,L2=vx*vx+vy*vy||1;let t=((px-ax)*vx+(py-ay)*vy)/L2;t=Math.max(0,Math.min(1,t));const cx=ax+vx*t,cy=ay+vy*t,r=r0+(r1-r0)*t;return((px-cx)**2+(py-cy)**2<=r*r)?t:-1;}
function ell(px,py,cx,cy,rx,ry,rot){let dx=px-cx,dy=py-cy;if(rot){const c=Math.cos(-rot),s=Math.sin(-rot);const x=dx*c-dy*s,y=dx*s+dy*c;dx=x;dy=y;}return(dx/rx)**2+(dy/ry)**2;}
function inPoly(x,y,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
const PRI={far:0,body:1,leg:2,ant:3,head:4,arm:5};
const NOLINE=new Set(['body|leg','leg|body','ant|head','head|ant']);
const GREEN_P=[[0,-0.3],[0.66,-0.3],[0.66,0],[0.44,0.16],[0.54,0.22],[0,0.28]];
const BLUE_P=[[0.45,0.16],[0.64,0.2],[1.05,0.3],[1.05,0.5],[0.5,0.58],[0.08,0.74],[-0.05,0.74],[-0.05,0.52],[0.5,0.34]];
function raster(sampler,o){
  const {U,X0,Y0,GW,GH}=o;
  const col=new Array(GW*GH).fill(null),lay=new Array(GW*GH).fill(null),mouth=new Array(GW*GH).fill(false);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const x=X0+(i+0.5)*U,y=Y0+(j+0.5)*U;if(y>640)continue;const r=sampler(x,y);if(r){const k=j*GW+i;col[k]=r.c;lay[k]=r.l;if(r.m)mouth[k]=true;}}
  const idx=(i,j)=>(i<0||j<0||i>=GW||j>=GH)?-1:j*GW+i;const out=[];
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const k=j*GW+i,l=lay[k];const ns=[idx(i-1,j),idx(i+1,j),idx(i,j-1),idx(i,j+1)];
    if(l===null){if(ns.some(n=>n>=0&&lay[n]!==null))out.push(k);continue;}
    let hit=false;for(const n of ns){if(n<0)continue;const m=lay[n];if(m===null||m===l||NOLINE.has(l+'|'+m))continue;if(PRI[m]>PRI[l]){hit=true;break;}}
    if(!hit&&mouth[k]&&ns.some(n=>n<0||!mouth[n]))hit=true;
    if(hit)out.push(k);}
  out.forEach(k=>{col[k]=C.ink;});
  return {w:GW,h:GH,g:col};
}
const ARMS_F=[[116,452,86,530],[359,452,389,530]];
function frontSampler(o){return (x,y)=>{
  const yb=y-(o.bob||0);
  for(let i=0;i<2;i++){const a=ARMS_F[i];const sw=(o.arm||0)*(i?-1:1);const t=cap(x,yb,a[0],a[1],a[2],a[3]+sw,24,22);if(t>=0)return{c:(t>0.18&&t<0.4)?C.b:C.w,l:'arm'};}
  if(ell(x,yb,235,262,205,168)<=1){
    if(o.back){return{c:ell(x,yb,235,240,172,150)>1?C.s1:C.w,l:'head'};}
    if(yb>=296&&ell(x,yb,240,296,50,64)<=1)return{c:yb>322?C.pk:C.ink,l:'head',m:true};
    if(ell(x,yb,150,248,50,48)<=1&&ell(x,yb,150,248,17,24)>1)return{c:C.b,l:'head'};
    if(ell(x,yb,325,245,62,63)<=1&&ell(x,yb,313,245,21,32)>1)return{c:C.g,l:'head'};
    let c=C.w;if(ell(x,yb,222,248,200,160)>1)c=C.s1;return{c,l:'head'};}
  if(ell(x,yb,233,40,40,23)<=1||(x>=220&&x<=248&&yb>=50&&yb<=110))return{c:C.w,l:'ant'};
  const inTorso=x>=143&&x<=332&&yb>=410&&yb<=578;
  const legIn=(cx,lift)=>{const yy=y+lift;return Math.abs(x-cx)<=43&&yy>=556&&yy<=640&&(yy<=606||ell(x,yy,cx,606,43,34)<=1);};
  const lL=o.lL||0,lR=o.lR||0,inL=legIn(187,lL),inR=legIn(293,lR);
  if(inTorso||inL||inR){let c=C.w;
    const yy=inTorso?yb:(inL?y+lL:y+lR);const u=(x-143)/189,v=(yy-452)/190;
    if(!inTorso&&yy>=598)c=C.b;
    else if(inTorso&&!o.back){if(inPoly(u,v,GREEN_P))c=C.g;else if(inPoly(u,v,BLUE_P))c=C.b;}
    if(c===C.w){if(o.back){if(inTorso&&Math.abs(x-212)<24)c=C.s1;}else if(x>304)c=C.s1;}
    return{c,l:inTorso?'body':'leg'};}
  return null;};}
function sideSampler(p){return (x,y)=>{
  const yb=y-p.sy;
  const limb=(sx,sy,a,r,far)=>{const L=44,ex=sx+Math.sin(a)*L,ey=sy+Math.cos(a)*L;const t=cap(x,yb,sx,sy,ex,ey,r,r-1);if(t>=0)return{c:(t>0.1&&t<0.32)?(far?C.bd:C.b):(far?C.s2:C.w),l:far?'far':'arm'};if(ell(x,yb,ex+Math.sin(a)*6,ey+Math.cos(a)*6,r+8,r+7)<=1)return{c:far?C.s2:C.w,l:far?'far':'arm'};return null;};
  let r=limb(240,462,p.armN,22,false);if(r)return r;
  if(ell(x,yb,272,265,203,165,-0.12)<=1){
    if(ell(x,yb,444,322,32,26)<=1)return{c:yb>310?C.pk:C.ink,l:'head',m:true};
    if(ell(x,yb,403,250,36,48)<=1)return{c:ell(x,yb,418,246,11,28)<=1?C.w:(p.green?C.g:C.b),l:'head'};
    if(Math.abs(Math.hypot(x-248,yb-282)-62)<11)return{c:C.s2,l:'head'};
    return{c:ell(x,yb,300,262,188,170)>1?C.s1:C.w,l:'head'};}
  if(ell(x,yb,122,44,38,22,-0.35)<=1||cap(x,yb,178,132,137,62,14,11)>=0)return{c:C.w,l:'ant'};
  const leg=(hx,a,near)=>{const L=78,ex=hx+Math.sin(a)*L,ey=560+Math.cos(a)*L;const t=cap(x,yb,hx,560,ex,ey,36,19);if(t<0)return null;const bl=t>0.68;return near?{c:bl?C.b:C.w,l:'leg'}:{c:bl?C.bd:C.s2,l:'far'};};
  r=leg(274,p.legN,true);if(r)return r;
  if(ell(x,yb,268,512,74,92)<=1){let c=C.w;if(x<222)c=C.s1;if(x>=296&&yb>=440&&yb<=500&&(x-296)>=(yb-440)*0.5)c=C.g;if(x>=306&&yb>=508&&yb<=570)c=C.b;return{c,l:'body'};}
  r=leg(258,p.legF,false);if(r)return r;
  r=limb(292,462,p.armF,20,true);if(r)return r;
  return null;};}
// 正面五官與胸口閃電花紋：依設定圖逐格描繪，避免小尺寸取樣時變形或缺色
const SM_EYE_B=[".BBB.","BB.BB","BB.BB","BB.BB",".BBB."];
const SM_EYE_G=[".GGGG.","GG.GGG","GG.GGG","GG.GGG","GGGGGG",".GGGG."];
const SM_MOUTH=["kkkk","kppk",".kk."];

function stampSmall(spr,dy){const W=spr.w,g=spr.g;const put=(x,y,c)=>{if(x<0||y<0||x>=W||y>=spr.h)return;g[y*W+x]=c;};
  const st=(pat,ox,oy,map)=>pat.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=map[r[i]];if(c)put(ox+i,oy+j+dy,c);}});
  // 先把取樣產生的五官清成白色，再蓋上逐格圖
  for(let y=7+dy;y<=17+dy;y++)for(let x=3;x<=17;x++){if(y<0||y>=spr.h)continue;const c=g[y*W+x];if(c===C.b||c===C.g||c===C.pk||(c===C.ink&&x>2&&x<17&&y>6+dy&&y<17+dy&&!(x===3||x===16)))g[y*W+x]=(c===C.ink&&isEdge(spr,x,y))?c:C.w;}
  st(SM_EYE_B,4,9,{B:C.b});st(SM_EYE_G,11,8,{G:C.g});st(SM_MOUTH,8,14,{k:C.ink,p:C.pk});
  SM_TORSO.forEach((r,j)=>{for(let i=0;i<9;i++){const x=6+i,y=20+j+dy;if(y<0||y>=spr.h)continue;const c=g[y*W+x];if(!c||c===C.ink)continue;const ch=r[i];g[y*W+x]=ch==='G'?C.g:ch==='B'?C.b:(c===C.s1?C.s1:C.w);}});
  return spr;}
function isEdge(spr,x,y){const W=spr.w,g=spr.g;const n=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];return n.some(q=>q[0]<0||q[1]<0||q[0]>=W||q[1]>=spr.h||!g[q[1]*W+q[0]]);}
const OF={U:22,X0:235-10*22,Y0:2,GW:20,GH:30}, OS={U:22,X0:268-10*22,Y0:2,GW:20,GH:30};
function omiFrames(){
  const walk=[{bob:0,lL:0,lR:0,arm:0},{bob:-22,lL:24,lR:0,arm:18},{bob:0,lL:0,lR:0,arm:0},{bob:-22,lL:0,lR:24,arm:-18}];
  const LEFT=[];for(let f=0;f<8;f++){const s=Math.sin(f/8*Math.PI*2);LEFT.push(raster(sideSampler({green:true,sy:Math.abs(s)<0.5?-11:0,legN:0.6*s,legF:-0.6*s,armN:-0.9*s-0.1,armF:0.9*s}),OS));}
  const F={left:LEFT,front:walk.map(o=>stampSmall(raster(frontSampler(o),OF),Math.round(o.bob/22))),back:walk.map(o=>raster(frontSampler(Object.assign({back:true},o)),OF)),
    idle:[stampSmall(raster(frontSampler({bob:0}),OF),0),stampSmall(raster(frontSampler({bob:22}),OF),1)],side:[]};
  for(let f=0;f<8;f++){const s=Math.sin(f/8*Math.PI*2);F.side.push(raster(sideSampler({sy:Math.abs(s)<0.5?-11:0,legN:0.6*s,legF:-0.6*s,armN:-0.9*s-0.1,armF:0.9*s}),OS));}
  return F;
}

const EPAL={k:'#1d2b3a',w:'#ffffff',y:'#ffd95a',o:'#ff9f2e',O:'#ffc247',r:'#ff6b5a',b:'#7cc6f2',l:'#b9dcff',g:'#c3bcd8',G:'#9189ad',p:'#f7a8b8',d:'#7d8aa8',D:'#5a6684',s:'#9aa3ad',n:'#8b6b4a',Y:'#e8c24a'};
function shapeMask(shape,x,y,w,h){const cx=w/2,px=x+0.5,py=y+0.5;
  switch(shape){
    case 'blob':{const ry=h*0.62,cy=h-0.5-ry*0.7;if(py>h-1)return false;return((px-cx)/(w/2-0.3))**2+((py-cy)/ry)**2<=1||(py>cy&&Math.abs(px-cx)<=w/2-0.8&&py<=h-1);}
    case 'round':return((px-cx)/(w/2-0.3))**2+((py-h/2)/(h/2-0.3))**2<=1;
    case 'cloud':{const r=h*0.34;const cs=[[w*0.3,h*0.58,r],[w*0.52,h*0.4,r*1.15],[w*0.72,h*0.6,r*0.95],[w*0.5,h*0.66,r]];return cs.some(q=>(px-q[0])**2+(py-q[1])**2<=q[2]*q[2]);}
    case 'rect':return px>=1&&px<=w-1&&py>=1&&py<=h-0.5&&!((px<2||px>w-2)&&(py<2||py>h-1.5));
    case 'rock':{const k=((px-cx)/(w/2-0.2))**4+((py-h*0.55)/(h*0.46))**4;return k<=1&&py>1.5;}
    case 'tri':{const top=1;return py>=top+Math.abs(px-cx)*(h-top)/(w/2)*0.95&&py<=h-0.5;}
    case 'spiky':{const r=Math.min(w,h)/2-1.6;const d=Math.hypot(px-cx,py-h/2);const a=Math.atan2(py-h/2,px-cx);return d<=r+(Math.cos(a*8)>0.6?1.6:0);}
  }return false;}
function genSprite(def,flash,big){
  const w=def.w,h=def.h;const g=[];for(let y=0;y<h;y++){g.push([]);for(let x=0;x<w;x++)g[y].push(shapeMask(def.shape,x,y,w,h)?'a':'.');}
  // 陰影與亮點
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(g[y][x]!=='a')continue;if(y>=h*0.72)g[y][x]='b';}
  const cx=Math.floor(w/2);
  const set=(x,y,c)=>{if(y>=0&&y<h&&x>=0&&x<w)g[y][x]=c;};
  if(def.draw)def.draw(set,w,h,cx,g,big);
  // 臉
  const ey=def.eyeY!=null?def.eyeY:Math.floor(h*0.5),es=big?2:1,gap=def.eyeGap||(big?3:2);
  if(def.face!=='none'){for(const sx of [cx-gap-es,cx+gap-1]){for(let i=0;i<es;i++)for(let j=0;j<es;j++){if(def.face==='droopy'){if(j===0)set(sx+i,ey+1,'k');}else if(def.face==='closed'){set(sx+i,ey+1,'k');}else set(sx+i,ey+j,'k');}}
    if(big){set(cx-1,ey+es+2,'k');set(cx,ey+es+2,'k');}}
  // 外框
  const o=g.map(r=>r.slice());for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(g[y][x]!=='.')continue;if([[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(q=>g[q[1]]&&g[q[1]][q[0]]&&g[q[1]][q[0]]!=='.'&&g[q[1]][q[0]]!=='k'))o[y][x]='k';}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){const ch=o[y][i];if(ch==='.')continue;let col=ch==='a'?def.a:ch==='b'?def.b:EPAL[ch];if(flash&&ch!=='k')col='#ffffff';x.fillStyle=col;x.fillRect(i,y,1,1);}
  return c;}

function hash2(x,y){let h=(x*374761393+y*668265263)>>>0;h=(h^(h>>>13))*1274126177>>>0;return (h^(h>>>16))>>>0;}
function tileSet(ph){const T=16,list=[];for(let v=0;v<4;v++){const c=document.createElement('canvas');c.width=T;c.height=T;const x=c.getContext('2d');const R=(a,bb,w,h,col)=>{x.fillStyle=col;x.fillRect(a,bb,w,h);};
  if(ph===0){R(0,0,T,T,'#dcaa78');R(0,0,T,1,'#c28d5c');R(0,8,T,1,'#c28d5c');R((v*5)%16,1,1,7,'#c28d5c');R((v*5+8)%16,9,1,7,'#c28d5c');if(v<2){R(2,3,3,1,'#e6b98a');R(9,12,4,1,'#e6b98a');}}
  else if(ph===1){R(0,0,T,T,'#d6dce2');R(0,0,T,1,'#bcc5ce');R(0,0,1,T,'#bcc5ce');if(v===2){R(5,6,1,3,'#b3bcc6');R(6,8,2,1,'#b3bcc6');}if(v===3)R(10,4,2,2,'#e8ecef');}
  else if(ph===2){R(0,0,T,T,'#9fb3c4');for(let i=0;i<16;i+=4)for(let j=(i/4)%2*2;j<16;j+=4)R(i+1,j+1,1,1,'#b4c5d4');}
  else if(ph===4){R(0,0,T,T,'#5e4d70');R(0,0,T,1,'#4f3f60');R(0,8,T,1,'#4f3f60');R((v*6)%16,1,1,7,'#4f3f60');R((v*6+9)%16,9,1,7,'#4f3f60');if(v===2){R(7,4,1,1,'#fff3b0');}}
  else if(ph===5){R(0,0,T,T,'#eef1f4');R(0,0,8,8,'#dfe5ea');R(8,8,8,8,'#dfe5ea');R(0,0,T,1,'#cfd6de');R(0,0,1,T,'#cfd6de');if(v===2)R(11,3,2,1,'#f7d9b0');}
  else if(ph===6){R(0,0,T,T,'#e9d8bd');for(let i=0;i<T;i+=4){R(i,0,1,T,'#e1ccad');}if(v===2){R(4,4,8,8,'#d9b98f');R(5,5,6,6,'#e9d8bd');}if(v===3){R(7,7,2,2,'#c98f6b');}}
  else {R(0,0,T,T,'#e8d7a8');R(0,0,T,1,'#d4c08c');R(0,8,T,1,'#d4c08c');R(8,1,1,7,'#d4c08c');R(3,9,1,7,'#d4c08c');if(v===2)R(5,3,3,1,'#f2e4bd');}
  list.push(c);}return list;}

  if(Math.abs(dx)+Math.abs(dy)>0.05){G.face=norm(dx,dy);G.walk+=dt*(8+4*Math.hypot(dx,dy));G.dir=Math.abs(dx)>Math.abs(dy)*0.8?(dx>0?'right':'left'):(dy<0?'back':'front');}else{G.dir='idle';G.walk+=dt*2;}

  const cap=90+Math.round(effSi()*8);G.spawnAcc+=rate*dt;while(G.spawnAcc>=1){G.spawnAcc--;if(G.en.length<cap){const p=ringPos();spawnEnemy(pick(stageTypes()),p[0],p[1]);}}
  if(G.elites.length&&G.t>=G.elites[0]){G.elites.shift();const p=ringPos();spawnEnemy(pick(stageTypes()),p[0],p[1],true);banner('精英煩惱出現！','淨化它會掉出禮物盒');}
  // 敵人
  const cell=14,grid=new Map();for(const e of G.en){const k=((e.x/cell)|0)+','+((e.y/cell)|0);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(e);}
  const slowR=has('evoDry')?G.auraR:0;
  for(const e of G.en){if(e.dead)continue;const T=ENEMY[e.type];let tx=G.x-e.x,ty=G.y-e.y,d=Math.hypot(tx,ty)||1;let sp=e.spd;if(slowR&&d<slowR)sp*=0.5;if(e.slowT>0)sp*=e.earSlow||0.55;if(e.stun>0)sp=0;
    let vx=tx/d*sp,vy=ty/d*sp;if(e.type==='lost'&&e.stun<=0){e.wob+=dt*4;vx+=-ty/d*Math.sin(e.wob)*22;vy+=tx/d*Math.sin(e.wob)*22;}
    const k=((e.x/cell)|0)+','+((e.y/cell)|0);const nb=grid.get(k);if(nb)for(const o of nb){if(o===e)continue;const ox=e.x-o.x,oy=e.y-o.y,od=ox*ox+oy*oy,rr=(e.r+o.r)*0.85;if(od>0.01&&od<rr*rr){const q=Math.sqrt(od);vx+=ox/q*28;vy+=oy/q*28;}}
    e.x+=(vx+e.kx*20)*dt;e.y+=(vy+e.ky*20)*dt;const damp=Math.pow(0.02,dt);e.kx*=damp;e.ky*=damp;e.flash-=dt;e.hitCd-=dt;e.fanCd-=dt;e.robCd-=dt;e.stun-=dt;e.slowT-=dt;

    if(d<e.r+6&&e.hitCd<=0&&e.stun<=0){e.hitCd=0.7;hurtPlayer(e.dmg,T.debuff);}}
  updBoss(dt);

  // 區域攻擊

  // 寶石

  G.gems=G.gems.filter(g=>!g.got);
  if(G.gems.length>160){const old=G.gems.splice(0,60);const sum=old.reduce((s,g)=>s+g.v,0);G.gems.push({x:old[0].x,y:old[0].y,v:sum,age:5,big:true});}
  while(G.xp>=G.need){G.xp-=G.need;G.lvl++;G.need=Math.floor(6+G.lvl*3.6);G.pending++;}

  const opened=G.boxes.filter(x=>x.got);G.boxes=G.boxes.filter(x=>!x.got);

}

    if(f.k==='cone'){const [x,y]=S(f.x,f.y);const base=Math.atan2(f.dir[1],f.dir[0]);b.fillStyle=f.col;for(let i=0;i<40;i++){const ang=base+(Math.random()*2-1)*f.half,rr=Math.random()*f.len;b.fillRect(Math.round(x+Math.cos(ang)*rr),Math.round(y+Math.sin(ang)*rr),1,1);}}

  // 手錶方向提示
  if(has('watch')||has('evoSmart')){const t=nearest(6);for(const e of t){const [x,y]=S(e.x,e.y);if(x>=0&&x<W&&y>=0&&y<H)continue;const a=Math.atan2(y-H/2,x-W/2);const ex=Math.max(4,Math.min(W-5,W/2+Math.cos(a)*W)),ey=Math.max(4,Math.min(H-5,H/2+Math.sin(a)*H));b.fillStyle='#ff6b5a';b.fillRect(Math.round(ex)-1,Math.round(ey)-1,3,3);b.fillStyle='#ffffff';b.fillRect(Math.round(ex),Math.round(ey),1,1);}}
  // 字母方向提示
  for(const s of G.sups){if(s.k!=='letter')continue;const [x,y]=S(s.x,s.y-5);if(x>=0&&x<W&&y>=0&&y<H)continue;const a=Math.atan2(y-H/2,x-W/2);const ex=Math.round(Math.max(6,Math.min(W-7,W/2+Math.cos(a)*W))),ey=Math.round(Math.max(6,Math.min(H-7,H/2+Math.sin(a)*H)));b.drawImage(MARK,ex-3,ey-3+Math.round(Math.sin(G.t*6)));}
  // 夥伴飄在身後側邊，不遮住神歐迷的眼睛與天線
  if(G.buddy){const side=G.face[0]>0?-1:1;b.drawImage(MARK,ppx+side*16-3,ppy-6+Math.round(Math.sin(G.t*3)*2)-3);}
  // 視線模糊
  if(G.deb.blur>0){const gr=b.createRadialGradient(W/2,H/2,Math.min(W,H)*0.18,W/2,H/2,Math.max(W,H)*0.6);gr.addColorStop(0,'rgba(60,70,90,0)');gr.addColorStop(1,'rgba(60,70,90,0.8)');b.fillStyle=gr;b.fillRect(0,0,W,H);}
  // 搖桿
  if(joy&&state==='play'){const f=DPR/K;const ox=Math.round(joy.ox*f),oy=Math.round(joy.oy*f);let jx=(joy.x-joy.ox)*f,jy=(joy.y-joy.oy)*f;const d=Math.hypot(jx,jy),m=12;if(d>m){jx=jx/d*m;jy=jy/d*m;}dotCircle(ox,oy,14,'rgba(255,255,255,0.75)',32,0);b.fillStyle='rgba(255,255,255,0.85)';b.beginPath();b.arc(ox+jx,oy+jy,4,0,Math.PI*2);b.fill();}

  sc.imageSmoothingEnabled=false;sc.drawImage(buf,0,0,W*K,H*K);
}

  c.textAlign='center';c.fillStyle=won?'#35A53A':'#1D2B3A';c.font='800 30px '+F;c.fillText(won?'打倒'+BOSSDEF[st.id].name+'！':'神歐迷累壞了',300,364);c.fillStyle='#5A6878';c.font='600 16px '+F;c.fillText(won?st.day+'的煩惱都淨化了':'下次挑對商品再試一次',300,390);dash(412);
  c.textAlign='left';c.fillStyle='#1D2B3A';c.font='800 19px '+F;c.fillText('使用的商品',76,446);let y=488;
  const drawRow=(id,name,right)=>{c.fillStyle='#FFF6D6';c.beginPath();c.arc(96,y-7,19,0,Math.PI*2);c.fill();c.save();c.translate(84,y-19);c.scale(2,2);drawIcon(c,id,0,0);c.restore();c.textAlign='left';c.fillStyle='#1D2B3A';c.font='600 18px '+F;c.fillText(name,126,y);c.textAlign='right';c.font='800 18px '+F;c.fillText(right,524,y);y+=44;};
  items.forEach(([id,l])=>{if(EVOS[id])drawRow(id,EVOS[id].name+'（進化）','★');else drawRow(id,ITEMS[id].name+(ITEMS[id].prod!==ITEMS[id].name?'｜'+ITEMS[id].prod:''),l>=5?'MAX':'Lv '+l);});
  if(unlocked.length){y+=4;c.textAlign='left';c.fillStyle='#35A53A';c.font='800 17px '+F;c.fillText('新解鎖商品：',76,y);c.fillStyle='#1D2B3A';c.font='600 16px '+F;const txt=unlocked.map(i=>ITEMS[i].name).join('、');c.fillText(txt,76,y+26);c.fillStyle='#5A6878';c.font='600 14px '+F;c.fillText('之後每一關都能抽到這些商品',76,y+50);y+=78;}
  y-=10;dash(y);y+=24;
  const top=items.filter(([id])=>EVOS[id]||ITEMS[id].kind==='w').sort((a,c2)=>c2[1]-a[1])[0];const title=won?(items.some(([id])=>EVOS[id])?'進化大師':st.day+'淨化王'):'明天再加油';
  c.fillStyle='#EEF6EC';c.fillRect(76,y,448,84);c.strokeStyle='#35A53A';c.lineWidth=3;c.strokeRect(76,y,448,84);c.textAlign='center';c.fillStyle='#5A6878';c.font='600 15px '+F;c.fillText('你的稱號',300,y+30);c.fillStyle='#35A53A';c.font='800 30px '+F;c.fillText(title,300,y+68);y+=110;
  const spr=OMI.idle[0];for(let j=0;j<spr.h;j++)for(let i=0;i<spr.w;i++){const col=spr.g[j*spr.w+i];if(!col)continue;c.fillStyle=col;c.fillRect(90+i*6,y+j*6,6,6);}
  const msg=won?(top?'今天靠'+(EVOS[top[0]]?EVOS[top[0]].name:ITEMS[top[0]].name)+'幫了大忙，謝謝你！':'謝謝你陪我度過這一天！'):'先看看圖鑑，找出克制這些煩惱的商品吧！';
  c.font='600 17px '+F;const lines=[];let line='';for(const ch of msg){if(c.measureText(line+ch).width>240&&line){lines.push(line);line=ch;}else line+=ch;}if(line)lines.push(line);
  const bx=250,by=y+30,bh=lines.length*26+28;c.fillStyle='#F2F8FD';c.fillRect(bx,by,280,bh);c.strokeStyle='#1D2B3A';c.lineWidth=2.5;c.strokeRect(bx,by,280,bh);c.textAlign='left';c.fillStyle='#1D2B3A';lines.forEach((l,i)=>c.fillText(l,bx+20,by+34+i*26));
  y+=200;let bxr=150;for(let i=0;i<48&&bxr<450;i++){const w=1+((i*7+G.kills)%4);c.fillStyle='#1D2B3A';c.fillRect(bxr,y,w,40);bxr+=w+3;}
  c.textAlign='center';c.fillStyle='#5A6878';c.font='600 14px '+F;c.fillText('每天都來陪神歐迷淨化一下',300,y+66);return cc;}
let cardCanvas=null;
async function showResult(){cardCanvas=await buildCard();$('cardImg').src=cardCanvas.toDataURL('image/png');$('resTitle').textContent=resultInfo.won?'過關！':'再挑戰一次吧';show('result',true);const nl=resultInfo.newLetter;if(nl)setTimeout(()=>banner('收集到字母 '+nl+'！',allLetters()?'集滿 SAKUYO：sakuyo 元氣夥伴會陪你出發！':'SAKUYO 收集 '+Object.keys(LETTERS).filter(k=>save.letters[k]).length+' / 6'),400);}
let downloads=null;$('dlBtn').hidden=true;
if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(d=>{downloads=d;if(d){$('dlBtn').hidden=false;$('saveHint').hidden=true;}else $('saveHint').hidden=false;}).catch(()=>{$('saveHint').hidden=false;});}else $('saveHint').hidden=false;
$('dlBtn').onclick=async()=>{if(!downloads||!cardCanvas)return;const blob=await new Promise(r=>cardCanvas.toBlob(r,'image/png'));try{await downloads.save({filename:'神歐迷淨化明細卡.png',data:blob});}catch(e){$('dlBtn').hidden=true;$('saveHint').hidden=false;}};
$('againBtn').onclick=()=>{show('result',false);startStage(G.si,G.starter);};$('selBtn').onclick=toSelect;

// ===== 迴圈 =====
let last=performance.now();
function loop(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;
  if(state==='play'){update(dt);hudT-=dt;if(hudT<=0){hud();hudT=0.1;}}
  if(G&&['play','level','pause','result'].includes(state))draw();
  requestAnimationFrame(loop);}
toSelect();requestAnimationFrame(loop);

})();
